name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Test Synthetic Generator
      run: |
        python src/synthetic_generator.py --count 100 --output data/synthetic_ci.txt

    - name: Test Training Pipeline (Smoke Test)
      run: |
        python src/train.py --version 1 --model_preset tiny --epochs 1 --exp_name ci-test-v1 --demo
        python src/train.py --version 2 --model_preset tiny --epochs 1 --exp_name ci-test-v2 --demo
        python src/train.py --version 3 --model_preset tiny --epochs 1 --exp_name ci-test-v3 --demo

